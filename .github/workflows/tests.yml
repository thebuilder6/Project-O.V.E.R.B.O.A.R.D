name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the solver, the studio and the optional stack
        run: python -m pip install -r requirements.txt -r requirements-optional.txt
      # --no-cache: the pass-cache is a local convenience, never a verdict.
      # The runner owns the exit code: 0 only when nothing failed or errored.
      - name: Test suite
        run: python run_tests.py --no-cache
